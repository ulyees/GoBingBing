<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GoBingBing</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="26" height="26" />
        <div class="brand-text">
          <h1>GoBingBing</h1>
          <p>打不开就换一个</p>
        </div>
      </div>
      <label class="switch" title="开启 / 暂停自动切换">
        <input id="enabled" type="checkbox" aria-label="启用自动切换" />
        <span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <main>
      <section class="card current">
        <div class="row">
          <span class="eyebrow">当前页面</span>
          <span id="current-state" class="pill">读取中…</span>
        </div>
        <div class="current-main">
          <span id="current-icon" class="icon big" aria-hidden="true"></span>
          <div class="current-text">
            <p id="current-host" class="host">—</p>
            <p id="current-hint" class="hint"></p>
          </div>
        </div>
        <button id="switch" class="primary" type="button" disabled>切换到 Bing</button>
      </section>

      <section class="card rules-card">
        <div class="row">
          <h2>切换规则</h2>
          <span id="probe-note" class="eyebrow">来源检测</span>
        </div>
        <ul id="rules" class="rules" aria-live="polite"></ul>
      </section>

      <section class="card">
        <div class="row">
          <h2>最近记录</h2>
          <button id="clear-log" class="link" type="button">清空</button>
        </div>
        <ul id="events" class="events">
          <li class="empty">暂无记录</li>
        </ul>
      </section>
    </main>

    <footer>
      <a id="options" href="#" class="link">规则与设置</a>
      <span id="version" class="muted"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
